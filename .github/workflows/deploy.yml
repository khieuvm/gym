name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Không huỷ lần deploy đang chạy, nhưng mỗi lúc chỉ chạy một lần
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Bật GitHub Pages cho repository
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        # Site chạy tại https://<user>.github.io/gym/ nên cần base path tương ứng
        env:
          VITE_BASE: /gym/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
